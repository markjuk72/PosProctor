    execErrState: Alerting
    for: 10m
    annotations:
      summary: "\U0001F6A8 {{ $labels.store }} ({{ $labels.group }}) - Commander System\
        \ Unreachable"
      description: "**COMMANDER SYSTEM UNREACHABLE**\n\n\U0001F4CD **Location:** {{\
        \ $labels.store }}, {{ $labels.group }}\n\U0001F50C **Device:** Commander\
